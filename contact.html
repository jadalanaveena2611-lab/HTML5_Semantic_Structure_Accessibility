<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Naveena</title>

    <meta name="description"
        content="Contact Naveena for questions, collaboration, projects and professional opportunities.">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <nav aria-label="Main navigation">

            <a href="index.html">Home</a><br><br>

            <a href="about.html">About</a><br><br>

            <a href="projects.html">Projects</a><br><br>

            <a href="skills.html">Skills</a><br><br>

            <a href="contact.html">Contact</a><br><br>

        </nav>

    </header>


    <main>

        <section aria-labelledby="contact-heading">

            <h1 id="contact-heading">
                Contact Me
            </h1>

            <p>
                If you would like to get in touch with me,
                please fill out the form below.
            </p>

        </section>


        <section aria-labelledby="form-heading">

            <h2 id="form-heading">
                Send Me a Message
            </h2>

            <form action="#" method="post">

                <div>

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div>

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >

                </div>


                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer>

</body>

</html>
